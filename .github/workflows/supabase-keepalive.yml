# Free Supabase projects pause after 7 days without activity. This pings the database daily.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "No SUPABASE_URL secret yet; skipping."; exit 0; fi
          curl --fail --silent --show-error -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/"
