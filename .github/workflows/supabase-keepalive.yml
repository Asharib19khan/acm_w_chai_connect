# Free Supabase projects pause after 7 days without activity. This pings the database daily.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        # The student site's live feed reads the database, which is what keeps a free project awake.
        # (Supabase's REST root no longer answers the public key, and every table is closed to it.)
        run: |
          curl --fail --silent --show-error --max-time 60 -o /dev/null \
            https://acmw-chai-connect.vercel.app/api/pulse
